<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <!-- Deep-violet gradient matching the React MedebLogo component -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="55%"  stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
  </defs>

  <!-- Gradient rounded-corner background -->
  <rect width="48" height="48" rx="10" ry="10" fill="url(#bg)"/>

  <!-- Market stall canopy — two tent peaks forming the M letterform -->
  <path
    d="M5,34 L5,22 L14,8 L23,19 L32,8 L43,22 L43,34"
    stroke="white"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Stall counter / shelf line -->
  <line
    x1="5" y1="29"
    x2="43" y2="29"
    stroke="white"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-opacity="0.65"
  />

  <!-- Amber goods dot — merchandise on the counter -->
  <circle cx="24" cy="39" r="3.5" fill="#f59e0b"/>
</svg>
